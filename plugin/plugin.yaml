name: hermes_laya
description: >-
  Native Hermes tool for Laya, a multilingual non-autoregressive System 1
  decision engine: typed decisions (choice/score/noul) over text or JSON in a
  single forward pass, no API key and no quota. Actions: decide (custom typed
  questions), schema (JSON Schema to typed values), batch (many states, one
  pass), long (windowed document scan), tournament (narrow a wide choice),
  detect / route (no model load), and the triage / guard / moderation /
  routemodel / email presets, plus status. Registers toolset laya.
author: Peter (lesterppo)
version: 2.0.0
license: MIT
kind: standalone
tags: [laya, decisions, classification, system-one, guardrails, triage, moderation, routing, non-autoregressive, llm-pre-filter, token-efficiency, local-inference, multilingual, native-tool]
homepage: https://github.com/lesterppo/laya-agents
